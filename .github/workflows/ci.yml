name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  editor-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run editor unit tests
        run: ./gradlew --no-daemon :plugin:text-editor:testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon :plugin:text-editor:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: juicetext-debug
          path: plugin/text-editor/build/outputs/apk/debug/*.apk
          if-no-files-found: error
